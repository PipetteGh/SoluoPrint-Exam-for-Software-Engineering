<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoluoPrint | Ultimate Print Shop Management System</title>
    <meta name="description" content="SoluoPrint - The complete solution for modern print shops. Manage jobs, customers, payments, and expenses with the most advanced management software." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soluoprint.com/" />
    <meta property="og:title" content="SoluoPrint | Professional Print Management" />
    <meta property="og:description" content="Streamline your printing business with SoluoPrint. The all-in-one platform for growth and efficiency." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="SoluoPrint | Professional Print Management" />
    <meta property="twitter:description" content="Streamline your printing business with SoluoPrint. The all-in-one platform for growth and efficiency." />
    <meta property="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .app-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .preloader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .preloader-logo {
        width: 120px;
        height: auto;
        opacity: 0.8;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="preloader-spinner"></div>
        <img src="/logo.png" alt="SoluoPrint" class="preloader-logo" onerror="this.style.display='none'" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
